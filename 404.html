    .marca {
      position: absolute;
      top: clamp(1.25rem, 3vh, 1.75rem);
      left: max(var(--gutter), calc((100vw - var(--container)) / 2 + var(--gutter)));
      display: inline-flex;
      font-family: "Archivo Black", "Archivo", sans-serif;
      font-size: 1.5rem;
      line-height: 1;
      letter-spacing: -.02em;
      color: var(--accent);
    }
    .marca span:last-child { color: var(--muted); transition: color .3s var(--ease-out); }
    .marca:hover span:last-child { color: var(--accent); }

    .erro {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: var(--container);
      margin-inline: auto;
      padding: clamp(6rem, 16vh, 9rem) var(--gutter) clamp(3rem, 10vh, 6rem);

      font-size: clamp(4.5rem, 16vw, 6rem);
      font-weight: 700;
      line-height: .9;
      letter-spacing: -.04em;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--accent-2);
      margin-bottom: 1.5rem;
    }
    @supports not (-webkit-text-stroke: 1px black) {
      .erro__codigo { color: var(--accent-2); }
    }

      max-width: 14ch;
      margin-bottom: 1rem;
      font-size: var(--fs-h2);

      font-size: var(--fs-lead);

      gap: .75rem;
    }
